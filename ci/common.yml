# Shared building blocks: path rules, caches, tool images, pipeline variables.
#
# Rule shape (plan 10 B2.3, DataHub's ci-optimization):
#   - MR pipeline: run only when the area's paths changed against the target branch.
#   - Branch pipeline (main, branches without an MR, schedules, manual runs): always run.
#   - Tag pipeline: never. A release tag only retags images already tested on main (ci/release.yml).

# ------------------------------------------------------------------------------------------- rules
.rules:java:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - backend/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - gradle.properties
          - gradlew
          - ci/java.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:python:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - workers/**/*
          - contracts/**/*
          - ci/python.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:web:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - web/**/*
          - contracts/**/*
          - ci/web.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

# Image rules = the area's paths + its Dockerfile + anything that changes how images are built.
.rules:image:backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - backend/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - gradle.properties
          - docker/backend.Dockerfile*
          - ci/docker.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:image:worker:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - workers/**/*
          - contracts/**/*
          - docker/worker.Dockerfile*
          - ci/docker.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:image:web:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - web/**/*
          - docker/web.Dockerfile*
          - ci/docker.yml
          - ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

# Smoke runs when anything that ends up in a running container changed.
.rules:smoke:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - backend/**/*
          - workers/**/*
          - web/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - docker/**/*
          - scripts/ci/**/*
          - ci/**/*
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules:release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/

# ------------------------------------------------------------------------------------------- images
.image:jdk:
  image: $JDK_IMAGE

.image:uv:
  image: $UV_IMAGE

.image:node:
  image: $NODE_IMAGE
  before_script:
    # pnpm version comes from web/package.json `packageManager` (one source of truth).
    - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    - corepack enable
    - cd web
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
    - pnpm install --frozen-lockfile --prefer-offline

# ------------------------------------------------------------------------------------------- caches
# Every job reads; only the cache:warm:* jobs on main write (plan 10 B2.3, DataHub ci-cache-warmup).
# GitLab keeps separate caches for protected branches by default, so MR pipelines cannot read what
# main wrote until "Use separate caches for protected branches" is cleared (Settings > CI/CD >
# General pipelines). See docs/architecture/delivery.md "Cache policy" before changing that.
.cache:gradle:
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  cache:
    key:
      prefix: gradle
      files: [gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml]
    paths:
      - .gradle-home/caches/modules-2/
      - .gradle-home/caches/build-cache-1/
      - .gradle-home/wrapper/
    policy: pull

.cache:uv:
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    UV_LINK_MODE: copy
  cache:
    key:
      prefix: uv
      files: [workers/uv.lock]
    paths: [.cache/uv/]
    policy: pull

.cache:pnpm:
  cache:
    key:
      prefix: pnpm
      files: [web/pnpm-lock.yaml]
    paths: [.pnpm-store/]
    policy: pull

# ------------------------------------------------------------------------------------------- jobs
# Computes the image tag once and hands it to later jobs as a dotenv artifact (DataHub's `setup` job).
ci:vars:
  stage: .pre
  needs: []
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        IMAGE_TAG="mr${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "IMAGE_TAG=$IMAGE_TAG" | tee build.env
  artifacts:
    reports:
      dotenv: build.env

cache:warm:gradle:
  extends: [.rules:main, .image:jdk, .cache:gradle]
  stage: build
  needs: []
  cache:
    policy: pull-push
  script:
    - ./gradlew --build-cache assemble testClasses
  # Not a gate: a warm-up failure must not hide a real failure elsewhere or block main.
  allow_failure: true

cache:warm:uv:
  extends: [.rules:main, .image:uv, .cache:uv]
  stage: build
  needs: []
  cache:
    policy: pull-push
  script:
    - cd workers
    - uv sync --frozen
    - uv cache prune --ci
  allow_failure: true

cache:warm:pnpm:
  extends: [.rules:main, .image:node, .cache:pnpm]
  stage: build
  needs: []
  cache:
    policy: pull-push
  script:
    - pnpm store prune
  allow_failure: true
