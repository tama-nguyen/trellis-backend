# Trivy settings shared by trivy:fs and trivy:image (ci/security.yml). Run locally the same way:
#   trivy fs --config ci/trivy.yaml .
severity:
  - CRITICAL
  - HIGH
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - "**/node_modules"
    - "**/.next"
    - "**/.venv"
    - "**/build"
    - .gradle-home
    - .cache
    - .pnpm-store
    - .trivycache
    - vendor
vulnerability:
  # Only fail on what can be fixed today; unfixed CVEs are tracked, not blocking.
  ignore-unfixed: true
ignorefile: ci/trivyignore
