# Workers (uv workspace, Python 3.12). Tool versions are pinned in workers/pyproject.toml.

py:lint:
  extends: [.rules:python, .image:uv, .cache:uv]
  stage: lint
  needs: []
  script:
    - cd workers
    # The lock must match every pyproject.toml in the workspace.
    - uv lock --check
    - uv sync --frozen
    - uv run ruff check --output-format=gitlab --output-file=../gl-code-quality-ruff.json . || { uv run ruff check .; exit 1; }
    - uv run ruff format --check .
    - uv run mypy
    # Generated models must match contracts/events; prints a diff and fails when stale.
    - uv run python ../contracts/codegen/python/generate.py --check
    # Generated API client must match contracts/openapi/openapi.json.
    - uv run python ../contracts/codegen/python/generate_sdk.py --check
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      codequality: gl-code-quality-ruff.json

py:test:
  extends: [.rules:python, .image:uv, .cache:uv]
  stage: test
  needs: []
  script:
    - cd workers
    - uv sync --frozen
    # Exit 5 = no tests collected; tests are written only when asked (decision T5), so that is a pass.
    # Integration tests (-m integration) start their own Docker containers on 127.0.0.1, which a
    # DinD runner cannot reach as localhost; they run locally (see docs/guide/running.md) until a
    # runner with host Docker exists.
    - uv run pytest --junitxml=../py-junit.xml --cov --cov-report=xml:../py-coverage.xml || [ $? -eq 5 ]
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: py-junit.xml
      coverage_report:
        coverage_format: cobertura
        path: py-coverage.xml
