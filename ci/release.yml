# Promotion and releases. Images are built once (sha-<short>) and promoted by adding tags with
# `buildx imagetools create`, which copies the manifest (and its SBOM/provenance attestations)
# without rebuilding, so production runs exactly the bytes that passed smoke.

.retag:
  extends: .docker
  stage: release
  variables:
    IMAGES: "backend worker-notice-stats web"

# Floating `main` = last main commit whose images passed smoke (DataHub `quickstart` tag).
docker:tag-main:
  extends: [.retag, .rules:main]
  needs: [ci:vars, smoke:compose]
  script:
    - |
      for img in $IMAGES; do
        src="$CI_REGISTRY_IMAGE/$img:$IMAGE_TAG"
        docker buildx imagetools create --tag "$CI_REGISTRY_IMAGE/$img:main" "$src"
        echo "tagged $src -> :main"
      done

# Tag vX.Y.Z on a main commit: add vX.Y.Z (and X.Y for final releases) to that commit's sha- images.
# Release tags are only cut from commits that already went through a main pipeline; this job fails if
# the source image is missing rather than building one.
docker:promote:
  extends: [.retag, .rules:release-tag]
  needs: []
  script:
    - SRC_TAG="sha-$CI_COMMIT_SHORT_SHA"
    - |
      case "$CI_COMMIT_TAG" in
        *-rc.*) EXTRA="" ;;
        *) EXTRA=$(printf '%s' "$CI_COMMIT_TAG" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/') ;;
      esac
    - |
      for img in $IMAGES; do
        src="$CI_REGISTRY_IMAGE/$img:$SRC_TAG"
        if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
          echo "missing $src: tag a commit that passed a main pipeline (no rebuild on release)"; exit 1
        fi
        tags="--tag $CI_REGISTRY_IMAGE/$img:$CI_COMMIT_TAG"
        if [ -n "$EXTRA" ]; then tags="$tags --tag $CI_REGISTRY_IMAGE/$img:$EXTRA"; fi
        docker buildx imagetools create $tags "$src"
        echo "promoted $src -> $CI_COMMIT_TAG $EXTRA"
      done

# Release notes from Conventional Commits (squash commits carry the MR title). Config: cliff.toml.
release:notes:
  extends: .rules:release-tag
  stage: release
  image:
    name: $GIT_CLIFF_IMAGE
    entrypoint: [""]
  needs: []
  variables:
    # git-cliff needs the full history and all tags to find the previous release.
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --tags
  script:
    - git-cliff --config ci/cliff.toml --latest --strip header --output release-notes.md
    - cat release-notes.md
  artifacts:
    expire_in: 30 days
    paths: [release-notes.md]

# The `release:` keyword needs the glab CLI in the job image (release-cli is deprecated).
release:
  extends: .rules:release-tag
  stage: release
  image: $GLAB_IMAGE
  needs: [docker:promote, release:notes]
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: ./release-notes.md
    assets:
      links:
        # Images: backend, worker-notice-stats, web, each tagged $CI_COMMIT_TAG.
        - name: Container images ($CI_COMMIT_TAG)
          url: "$CI_PROJECT_URL/container_registry"
          link_type: image
