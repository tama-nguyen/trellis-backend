# Image builds: Docker-in-Docker + buildx, pushed to $CI_REGISTRY_IMAGE/<image>:<IMAGE_TAG>.
#
#   MR    mr<iid>-<short_sha>   (cleanup policy removes ^mr\d+- after 14 days)
#   main  sha-<short_sha>       (immutable; `main` is added by docker:tag-main only after smoke)
#
# Kaniko is no longer maintained (GitLab docs mark it removed), hence DinD. On a Kubernetes runner
# without privileged mode, switch `.docker` to rootless BuildKit (moby/buildkit:rootless +
# buildctl-daemonless.sh); the build script stays the same apart from the CLI call.
# Only amd64 for v0.1 (arm64 through QEMU is slow); add `--platform linux/amd64,linux/arm64` later.

.docker:
  image: $DOCKER_CLI_IMAGE
  services:
    - name: $DOCKER_DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  before_script:
    - until docker info >/dev/null 2>&1; do echo "waiting for dind"; sleep 1; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

.docker:build:
  extends: .docker
  stage: package
  # IMAGE_NAME, DOCKERFILE and (optionally) BUILD_ARGS come from the concrete job.
  script:
    - docker buildx create --use --driver docker-container --name trellis-builder >/dev/null
    - IMG="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    # Registry build cache: every pipeline reads it, only main writes it (one writer, like the caches).
    - CACHE_TO=""
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then CACHE_TO="--cache-to=type=registry,ref=$IMG:buildcache,mode=max"; fi
    - ARGS=""
    - for a in $BUILD_ARGS; do ARGS="$ARGS --build-arg $a"; done
    - >-
      docker buildx build
      --file "$DOCKERFILE"
      --platform linux/amd64
      --tag "$IMG:$IMAGE_TAG"
      --cache-from "type=registry,ref=$IMG:buildcache"
      $CACHE_TO
      $ARGS
      --build-arg "VERSION=$IMAGE_TAG"
      --build-arg "REVISION=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.source=$CI_PROJECT_URL"
      --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
      --label "org.opencontainers.image.created=$CI_PIPELINE_CREATED_AT"
      --sbom=true
      --provenance=mode=max
      --push
      .
    - echo "pushed $IMG:$IMAGE_TAG"

docker:build:backend:
  extends: [.docker:build, .rules:image:backend]
  needs:
    - job: ci:vars
    # The Dockerfile only packages the jar built here.
    - job: java:build
  variables:
    IMAGE_NAME: backend
    DOCKERFILE: docker/backend.Dockerfile

docker:build:worker:
  extends: [.docker:build, .rules:image:worker]
  needs: [ci:vars]
  variables:
    IMAGE_NAME: worker-notice-stats
    DOCKERFILE: docker/worker.Dockerfile
    BUILD_ARGS: "WORKER_PACKAGE=trellis-notice-stats WORKER_NAME=notice-stats WORKER_EXTRAS=postgres"

docker:build:web:
  extends: [.docker:build, .rules:image:web]
  needs: [ci:vars]
  variables:
    IMAGE_NAME: web
    DOCKERFILE: docker/web.Dockerfile
