# Backend (Gradle, Java 21). Task names come from the root build.gradle.kts and build-logic.

java:lint:
  extends: [.rules:java, .image:jdk, .cache:gradle]
  stage: lint
  needs: []
  script:
    - ./gradlew --build-cache lintCheck

# The boot jar is the only input of the backend image: docker/backend.Dockerfile packages, never compiles.
java:build:
  extends: [.image:jdk, .cache:gradle]
  stage: build
  needs: []
  # Also runs when only the backend Dockerfile changed: docker:build:backend needs this jar.
  rules:
    - !reference [.rules:java, rules]
    - !reference [.rules:image:backend, rules]
  script:
    - ./gradlew --build-cache :trellis-app:bootJar
  artifacts:
    expire_in: 1 day
    paths:
      - backend/apps/app/build/libs/

java:test:
  extends: [.rules:java, .image:jdk, .cache:gradle]
  stage: test
  needs: []
  # Testcontainers needs a Docker daemon. TODO(wire): when backend integration tests land, add the
  # DinD service from `.docker` (ci/docker.yml) here, with TESTCONTAINERS_HOST_OVERRIDE=docker.
  script:
    # TODO(wire): jacocoTestReport must exist (backend convention plugin) for the coverage report below.
    # `check` includes :trellis-app:checkApiContracts (boots the app on Testcontainers): it fails when
    # contracts/openapi/openapi.json or contracts/graphql/schema.graphqls no longer match the code. Named here
    # so the drift check stays even if someone narrows the task list.
    - ./gradlew --build-cache --continue check :trellis-app:checkApiContracts
    # Generated code (OpenAPI export, codegen) is committed: a tracked file changed by the build means
    # someone forgot to regenerate. Untracked files are build output and are ignored here.
    # The JDK image has no git; the CI toolchain image (docs/architecture/delivery.md, later) will.
    - apt-get -qq update && apt-get -qq install -y --no-install-recommends git >/dev/null
    - |
      if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
        git status --porcelain --untracked-files=no
        echo "Generated files are out of date: run the build locally and commit the result."
        exit 1
      fi
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: backend/**/build/test-results/test/TEST-*.xml
      coverage_report:
        coverage_format: jacoco
        path: backend/**/build/reports/jacoco/test/jacocoTestReport.xml
