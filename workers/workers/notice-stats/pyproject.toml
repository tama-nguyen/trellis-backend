[project]
name = "trellis-notice-stats"
version = "0.1.0"
description = "Sample worker: counts published notices from notice.published v1, idempotent via the inbox."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "trellis-core",
    "trellis-events",
]

[project.optional-dependencies]
# Image builds pick transports with WORKER_EXTRAS (docker/worker.Dockerfile), e.g. "kafka postgres".
kafka = ["trellis-events[kafka]"]
postgres = ["trellis-events[postgres]"]

# Discovery is by entry point only: installing the package is what makes `trellis worker run
# notice-stats` work. Nothing registers itself as an import side effect.
[project.entry-points."trellis.workers"]
notice-stats = "trellis_notice_stats.worker:NoticeStatsWorker"

[tool.uv.sources]
trellis-core = { workspace = true }
trellis-events = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
