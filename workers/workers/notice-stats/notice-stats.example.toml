# Example config for `trellis worker run notice-stats --config notice-stats.example.toml`.
# Containers usually need no file at all: without --config the same settings come from
# TRELLIS_EVENTS_TRANSPORT, TRELLIS_KAFKA_BOOTSTRAP_SERVERS, TRELLIS_DATABASE_URL, TRELLIS_HEALTH_*.
# ${VAR} is expanded from the environment; an unset variable stops the worker with exit 78.

[pipeline]
consumer_name = "notice-stats"     # inbox key and Kafka group.id: never rename casually
failure_mode = "CONTINUE"          # CONTINUE = dead-letter and move on; THROW = stop, do not ack
concurrency = 1                    # >1 = parallel across aggregate ids, ordered within one

[pipeline.retry]                   # shared Backoff (contracts/testdata/backoff.json)
base_delay_ms = 1000
max_delay_ms = 30000
max_attempts = 4

[transport]
type = "kafka"
bootstrap_servers = "${TRELLIS_KAFKA_BOOTSTRAP_SERVERS}"
# topics defaults to the worker's event types: ["notice.published"]

[worker]
store = "postgres"
postgres_dsn = "${TRELLIS_DATABASE_URL}"

[health]                           # /health/live, /health/ready, /metrics
enabled = true
host = "127.0.0.1"                 # 0.0.0.0 only where Prometheus/the orchestrator must reach it
port = 9464
shutdown_grace_s = 0
