[project]
name = "trellis-sdk"
version = "0.1.0"
description = "Typed HTTP client for the Trellis backend (retries, 429, token refresh, ProblemDetail errors)."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "trellis-core",
    "httpx>=0.27,<1",
]

[tool.uv.sources]
trellis-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
