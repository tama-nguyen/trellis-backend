[project]
name = "trellis-core"
version = "0.1.0"
description = "Trellis platform core: config, env, secrets, logging, tracing, backoff, ids, plugins, reports."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
# OTLP export is opt-in: telemetry stays off unless TRELLIS_OTEL_ENABLED=true (decision T13).
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.27,<2"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
