[project]
name = "trellis-cli"
version = "0.1.0"
description = "The `trellis` command line: validate events, run workers, inspect config."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "trellis-core",
    "trellis-events",
    "trellis-sdk",
    "click>=8.1,<9",
]

[project.scripts]
trellis = "trellis_cli.main:run"

[tool.uv.sources]
trellis-core = { workspace = true }
trellis-events = { workspace = true }
trellis-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
