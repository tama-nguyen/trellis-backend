# The Python contract package published from this repo (decision T22). Everything under
# src/trellis_contracts/events/ and src/trellis_contracts/api/ is generated from contracts/; the rest
# (transport.py, client.py) is hand-written glue. Release: docs/architecture/contracts.md.
#
# The version is a placeholder: the publish job rewrites it from the git tag
# (scripts/contracts/version.sh), so nothing has to be bumped by hand in a merge request.
[project]
name = "trellis-contracts"
version = "0.0.0"
description = "Generated Trellis contracts: event payload models and a typed client for the backend API."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9,<3",
]

[project.urls]
Homepage = "https://gitlab.example.test/trellis/trellis-backend"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trellis_contracts"
module-root = "src"
