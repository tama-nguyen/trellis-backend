# pnpm only runs dependency install scripts that are listed here.
# @swc/core and @parcel/watcher (pulled in by next-intl's tooling) ship prebuilt
# binaries as optional dependencies, so their postinstall fallbacks are not needed.
allowBuilds:
  "@parcel/watcher": false
  # orval's config loader; the platform binary comes as an optional dependency, the postinstall only checks it.
  esbuild: false
  "@swc/core": false
minimumReleaseAgeExclude:
  - "@playwright/test@1.65.1"
  - playwright-core@1.65.1
  - playwright@1.65.1

# Security floor for transitive dependencies. next pins postcss 8.4.31, which Trivy flags
# (CVE-2026-45623, CVE-2026-73646, fixed in 8.5.18). Remove once next ships a fixed postcss.
overrides:
  "postcss@<8.5.18": "^8.5.18"
