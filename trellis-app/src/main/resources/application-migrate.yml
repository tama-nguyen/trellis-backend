# Composable operational profile: combine with an environment (dev,setup | prod,setup | prod,migrate).
# App mode `migrate`: apply Liquibase, run MigrationSteps, exit 0/1. No web server, no relay, no consumers.
spring:
  main:
    web-application-type: none
trellis:
  migration:
    run-on-startup: true
  events:
    relay:
      enabled: false
