# Trellis / production environment. Self-contained configuration for deployment.
# Inject actual secrets from environment/secret manager; never commit live credentials.
# This file deliberately duplicates cross-environment settings (there is no common profile).
spring:
  application:
    # Service name in logs, traces and metrics.
    name: ${TRELLIS_APP_NAME:trellis-backend}
  threads:
    virtual:
      # Virtual threads for request handling and @Async; JDBC pool size still bounds DB concurrency.
      enabled: true
  lifecycle:
    # Time given to in-flight requests and relay passes during shutdown.
    timeout-per-shutdown-phase: ${TRELLIS_SHUTDOWN_TIMEOUT:30s}
  datasource:
    # PostgreSQL 17: URL, username and password must come from deployment secrets.
    url: ${TRELLIS_DB_URL}
    username: ${TRELLIS_DB_USER}
    password: ${TRELLIS_DB_PASSWORD}
    hikari:
      # Leave headroom: @DistributedLock pins one extra connection per held lock.
      maximum-pool-size: ${TRELLIS_DB_POOL_SIZE:20}
  jpa:
    # Liquibase owns the schema (ADR 0004). Hibernate only checks that every entity matches its table,
    # so a drifted mapping fails startup instead of failing a request later.
    hibernate:
      ddl-auto: validate
    # A session must not outlive the use case: leaving this on makes lazy loading fire in the web layer.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Batch inserts and updates; ordering is what makes batching actually group statements.
          batch_size: 50
        order_inserts: true
        order_updates: true
  liquibase:
    # One master per environment: open it to see exactly what this environment runs.
    change-log: classpath:db/changelog/db.changelog-prod.yaml
  kafka:
    # Kafka broker address is required only when Kafka transport is enabled.
    bootstrap-servers: ${TRELLIS_KAFKA_BOOTSTRAP:}
    listener:
      # Consumers are started by the event platform, not by @KafkaListener.
      auto-startup: false
  mail:
    # Production SMTP endpoint and credentials come from deployment secrets.
    host: ${TRELLIS_SMTP_HOST}
    port: ${TRELLIS_SMTP_PORT:587}
    username: ${TRELLIS_SMTP_USERNAME}
    password: ${TRELLIS_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  graphql:
    http:
      # Under /api so the web BFF proxy (/api/**) reaches it like REST.
      path: /api/graphql
    schema:
      # Every module ships graphql/<module>/*.graphqls; classpath* also finds them inside module jars.
      locations: classpath*:graphql/**/
      introspection:
        # Expose GraphQL introspection only in development; API schema lives in contracts/graphql.
        enabled: false
    graphiql:
      # In-browser GraphiQL IDE (enabled only for development).
      enabled: false
  mvc:
    problemdetails:
      # The platform's GlobalExceptionHandler renders problems; Spring's built-in variant stays off.
      enabled: false

server:
  # API port.
  port: ${TRELLIS_SERVER_PORT:8080}
  # Finish in-flight requests on SIGTERM; readiness turns DOWN first.
  shutdown: graceful
  error:
    # Never echo exception messages or stack traces from the container's error page.
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    # OpenAPI document at /v3/api-docs (enabled in dev/test for tooling and contract export).
    enabled: ${TRELLIS_OPENAPI_ENABLED:false}
  # Only the HTTP API; the container's /error page is not an endpoint clients call.
  paths-to-match: /api/**
  # Deterministic output, so the committed contracts/openapi/openapi.json diffs cleanly.
  writer-with-order-by-keys: true

management:
  server:
    # Actuator on its own port, never routed publicly.
    port: ${TRELLIS_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        # Anything more (env, configprops, loggers) needs an explicit decision per environment.
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        # /actuator/health/liveness and /actuator/health/readiness.
        enabled: true
      group:
        liveness:
          # Liveness = the process is not wedged. Never include dependencies: a DB outage must not restart pods.
          include: livenessState
        readiness:
          # Readiness = may take traffic: state (migrations, shutdown) plus the database.
          include: readinessState,db
      # Component details only for authorised callers; the port is internal anyway.
      show-details: never
    env:
      # Values masked; SensitiveProperties decides for trellis.* when this is relaxed.
      show-values: never
    configprops:
      show-values: never
  observations:
    annotations:
      # Enables Micrometer's ObservedAspect for @Observed (metrics + spans).
      enabled: true
  tracing:
    sampling:
      # Fraction of traces recorded. 1.0 in dev, lower in prod.
      probability: ${TRELLIS_TRACE_SAMPLING:0.1}
    export:
      # Off until a collector exists; set TRELLIS_OTLP_ENABLED=true with the endpoint below.
      enabled: ${TRELLIS_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP/HTTP traces endpoint of the OpenTelemetry Collector.
          # Per environment; only used when TRELLIS_OTLP_ENABLED is true.
          endpoint: ${TRELLIS_OTLP_TRACES_ENDPOINT:}
  otlp:
    metrics:
      export:
        # Metrics are scraped from /actuator/prometheus; OTLP push stays off.
        enabled: false
  metrics:
    tags:
      # Common tag on every metric.
      application: ${spring.application.name}

logging:
  pattern:
    # Text-log format when plain console logging is used; production selects ECS JSON.
    console: "%d{HH:mm:ss.SSS} %5p [%15.15t] %-40.40logger{39} [cid=%X{correlation_id:-} trace=%X{traceId:-} actor=%X{actor:-}]
      %m %kvp%n%wEx"
  structured:
    json:
      rename:
        # MDC keys of Micrometer Tracing, renamed to the cross-language log field names.
        traceId: trace_id
        spanId: span_id

    format:
      # Elastic Common Schema JSON on stdout; MDC (trace_id, correlation_id, actor) included.
      console: ecs
trellis:
  web:
    # One log line per HTTP request (method, path, status, duration).
    request-log: ${TRELLIS_WEB_REQUEST_LOG:true}
  observability:
    # Cap of distinct uri tag values on http.server.requests.
    max-uri-tags: 200
  security:
    # OIDC issuer; JWKS is discovered lazily. Can fall back to Spring's standard
    # key, which docker/compose.yml sets (SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI).
    issuer-uri: ${TRELLIS_OIDC_ISSUER_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri:}}
    # Explicit JWKS URL; overrides discovery.
    jwk-set-uri: ${TRELLIS_OIDC_JWK_SET_URI:}
    # Accepted audiences are mandatory outside dev/test.
    audiences: ${TRELLIS_OIDC_AUDIENCES}
    # Where roles sit in the token (Keycloak realm roles).
    roles-claim: realm_access.roles
    # Claim with direct permissions (service tokens).
    permissions-claim: permissions
    # Claim that marks a client-credentials (service) token.
    service-claim: client_id
    grants:
      # Short TTL bounds revocation lag if a process misses explicit cache invalidation.
      cache-ttl: ${TRELLIS_GRANT_CACHE_TTL:PT30S}
      # Bounds memory used by subject-and-scope authorization entries.
      cache-max-size: ${TRELLIS_GRANT_CACHE_MAX_SIZE:10000}
    cors:
      # Exact browser origins allowed to call the API directly (the BFF does not need CORS).
      allowed-origins: ${TRELLIS_CORS_ORIGINS:}
  identity:
    # Short-lived opaque access token; every request resolves it against the session table.
    access-token-ttl: ${TRELLIS_IDENTITY_ACCESS_TOKEN_TTL:PT15M}
    # Absolute native session lifetime; refresh rotation does not extend it.
    refresh-token-ttl: ${TRELLIS_IDENTITY_REFRESH_TOKEN_TTL:P30D}
    # One-time verification link lifetime.
    verify-email-token-ttl: ${TRELLIS_IDENTITY_VERIFY_EMAIL_TOKEN_TTL:PT30M}
    # One-time password reset link lifetime.
    reset-password-token-ttl: ${TRELLIS_IDENTITY_RESET_PASSWORD_TOKEN_TTL:PT15M}
    # BCrypt work factor for native passwords.
    bcrypt-strength: ${TRELLIS_IDENTITY_BCRYPT_STRENGTH:12}
    # Coarse role assigned to every active native account.
    default-role: ${TRELLIS_IDENTITY_DEFAULT_ROLE:learner}
    # Public frontend destinations embedded in account emails.
    verify-email-uri: ${TRELLIS_IDENTITY_VERIFY_EMAIL_URI}
    reset-password-uri: ${TRELLIS_IDENTITY_RESET_PASSWORD_URI}
    # Verified sender configured at the production SMTP provider.
    mail-from: ${TRELLIS_IDENTITY_MAIL_FROM}
  graphql:
    # Deepest selection nesting a GraphQL query may have (rejected before execution).
    max-depth: ${TRELLIS_GRAPHQL_MAX_DEPTH:15}
    # Field count a GraphQL query may select (each field costs 1; rejected before execution).
    max-complexity: ${TRELLIS_GRAPHQL_MAX_COMPLEXITY:200}
  pagination:
    # Required cursor-signing secret (>= 16 bytes); no production fallback.
    cursor-secret: ${TRELLIS_CURSOR_SECRET}
  persistence:
    tx-retry:
      # Attempts of RetryingTransactions on optimistic-lock or serialization conflicts.
      max-attempts: 3
  migration:
    # true only in the migrate app mode (profile `migrate`).
    run-on-startup: false
    # Refuse readiness while a blocking MigrationStep is not DONE.
    enforce-blocking: true
    # Run non-blocking MigrationSteps in the background of the serving app.
    non-blocking-in-background: false
  idempotency:
    # How long a crashed in-flight call blocks its idempotency key.
    in-progress-timeout: PT5M
  rate-limit:
    # memory (per instance) or redis (shared across instances).
    store: ${TRELLIS_RATE_LIMIT_STORE:memory}
    redis:
      # Redis URI when store=redis; may contain a password, so it is classified sensitive.
      uri: ${TRELLIS_REDIS_URI:}
  events:
    # inmemory (single process) or kafka.
    transport: ${TRELLIS_EVENTS_TRANSPORT:inmemory}
    # Envelope `producer` field.
    producer: ${spring.application.name}
    relay:
      # Run the outbox relay in this process.
      enabled: ${TRELLIS_OUTBOX_RELAY_ENABLED:true}
      # Ordering shards; change only while no NEW rows exist (see docs/architecture/backend.md runbook).
      shards: 4
      # Delay between relay ticks.
      poll-interval: PT0.5S
      # Row-caused failures before a row becomes FAILED.
      max-attempts: 10
    consumer:
      # Kafka consumer group prefix; group = prefix + handler consumerName.
      group-prefix: ${TRELLIS_CONSUMER_GROUP_PREFIX:trellis.}
      # Handler attempts before the failure mode (DLQ or halt) applies.
      max-attempts: 4
    retention:
      # Keep published outbox rows this long.
      published-for: P7D
      # Keep inbox rows this long; must exceed Kafka topic retention.
      processed-for: P14D
  setup:
    # true only in the setup app mode (profile `setup`).
    enabled: false
    # Create Kafka topics (and their .dlq topics) for these event types.
    create-kafka-topics: ${TRELLIS_SETUP_KAFKA_TOPICS:false}
    topics:
      - notice.published
    # Create the object-storage bucket (trellis.storage.s3.bucket).
    create-s3-bucket: ${TRELLIS_SETUP_S3_BUCKET:false}
    # Setup-only S3 HTTP timeouts (no AWS SDK).
    s3:
      connect-timeout: ${TRELLIS_S3_CONNECT_TIMEOUT:10s}
      request-timeout: ${TRELLIS_S3_REQUEST_TIMEOUT:60s}
  storage:
    s3:
      # Environment-specific object storage endpoint, bucket and credentials.
      endpoint: ${TRELLIS_S3_ENDPOINT:}
      # Signing region; must match the S3-compatible provider.
      region: ${TRELLIS_S3_REGION:us-east-1}
      bucket: ${TRELLIS_S3_BUCKET:}
      access-key: ${TRELLIS_S3_ACCESS_KEY:}
      # Sensitive value, injected by the deployment environment when S3 is configured.
      secret-key: ${TRELLIS_S3_SECRET_KEY:}
  features:
    notice-search:
      # Sample flag shown to the web app (GET /api/app-config).
      enabled: false
      owner: platform
      sunset: 2027-06-30
      client-visible: true
    ops-api:
      # Operator endpoints under /api/ops (DLQ replay, read-model rebuild).
      enabled: ${TRELLIS_FEATURE_OPS_API:true}
      owner: platform
      sunset: 2027-12-31
