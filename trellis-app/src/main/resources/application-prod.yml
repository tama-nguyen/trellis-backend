# Prod overrides for shared application/config defaults.
# Required secrets have no local fallback. Inject them through the deployment environment.
spring:
  datasource:
    url: ${TRELLIS_DB_URL}
    username: ${TRELLIS_DB_USER}
    password: ${TRELLIS_DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-prod.yaml
  kafka:
    bootstrap-servers: ${TRELLIS_KAFKA_BOOTSTRAP:}
  mail:
    host: ${TRELLIS_SMTP_HOST}
    port: ${TRELLIS_SMTP_PORT:587}
    username: ${TRELLIS_SMTP_USERNAME}
    password: ${TRELLIS_SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  graphql:
    schema:
      introspection:
        enabled: false
    graphiql:
      enabled: false
springdoc:
  api-docs:
    enabled: ${TRELLIS_OPENAPI_ENABLED:false}
management:
  tracing:
    sampling:
      probability: ${TRELLIS_TRACE_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRELLIS_OTLP_TRACES_ENDPOINT:}
logging:
  structured:
    format:
      console: ecs
trellis:
  security:
    issuer-uri: ${TRELLIS_OIDC_ISSUER_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri:}}
    jwk-set-uri: ${TRELLIS_OIDC_JWK_SET_URI:}
    audiences: ${TRELLIS_OIDC_AUDIENCES}
    cors:
      allowed-origins: ${TRELLIS_CORS_ORIGINS:}
  identity:
    verify-email-uri: ${TRELLIS_IDENTITY_VERIFY_EMAIL_URI}
    mail-from: ${TRELLIS_IDENTITY_MAIL_FROM}
  pagination:
    cursor-secret: ${TRELLIS_CURSOR_SECRET}
  rate-limit:
    key-secret: ${TRELLIS_RATE_LIMIT_KEY_SECRET}
    namespace: ${TRELLIS_RATE_LIMIT_NAMESPACE}
    store: ${TRELLIS_RATE_LIMIT_STORE:redis}
    redis:
      uri: ${TRELLIS_REDIS_URI:}
  events:
    transport: ${TRELLIS_EVENTS_TRANSPORT:inmemory}
    relay:
      enabled: ${TRELLIS_OUTBOX_RELAY_ENABLED:true}
  setup:
    s3:
      connect-timeout: ${TRELLIS_S3_CONNECT_TIMEOUT:10s}
      request-timeout: ${TRELLIS_S3_REQUEST_TIMEOUT:60s}
  storage:
    s3:
      endpoint: ${TRELLIS_S3_ENDPOINT:}
      region: ${TRELLIS_S3_REGION:us-east-1}
      bucket: ${TRELLIS_S3_BUCKET:}
      access-key: ${TRELLIS_S3_ACCESS_KEY:}
      secret-key: ${TRELLIS_S3_SECRET_KEY:}
