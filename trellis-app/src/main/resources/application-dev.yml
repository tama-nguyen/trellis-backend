# Dev overrides for shared application/config defaults.
spring:
  datasource:
    url: ${TRELLIS_DB_URL:jdbc:postgresql://localhost:15432/trellis}
    username: ${TRELLIS_DB_USER:trellis}
    password: ${TRELLIS_DB_PASSWORD:trellis}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-dev.yaml
  kafka:
    bootstrap-servers: ${TRELLIS_KAFKA_BOOTSTRAP:localhost:19092}
  mail:
    host: ${TRELLIS_SMTP_HOST:localhost}
    port: ${TRELLIS_SMTP_PORT:11025}
  graphql:
    schema:
      introspection:
        enabled: true
    graphiql:
      enabled: true
springdoc:
  api-docs:
    enabled: true
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        endpoint: ${TRELLIS_OTLP_TRACES_ENDPOINT:http://localhost:14318/v1/traces}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TRELLIS_OTLP_TRACES_ENDPOINT:}
trellis:
  security:
    issuer-uri: ${TRELLIS_OIDC_ISSUER_URI:http://localhost:18180/realms/trellis}
    jwk-set-uri: ${TRELLIS_OIDC_JWK_SET_URI:}
    audiences: ${TRELLIS_OIDC_AUDIENCES:}
    cors:
      allowed-origins: http://localhost:3000
    public-paths: /error,/v3/api-docs,/v3/api-docs/**,/graphiql
  identity:
    verify-email-uri: ${TRELLIS_IDENTITY_VERIFY_EMAIL_URI:http://localhost:13000/verify-email}
    mail-from: ${TRELLIS_IDENTITY_MAIL_FROM:no-reply@example.test}
  pagination:
    cursor-secret: ${TRELLIS_CURSOR_SECRET:}
  rate-limit:
    key-secret: local-rate-limit-secret
    namespace: trellis-local
    store: ${TRELLIS_RATE_LIMIT_STORE:memory}
    redis:
      uri: ${TRELLIS_REDIS_URI:redis://localhost:16379}
  events:
    transport: ${TRELLIS_EVENTS_TRANSPORT:inmemory}
    relay:
      enabled: ${TRELLIS_OUTBOX_RELAY_ENABLED:true}
  setup:
    s3:
      connect-timeout: ${TRELLIS_S3_CONNECT_TIMEOUT:5s}
      request-timeout: ${TRELLIS_S3_REQUEST_TIMEOUT:30s}
  storage:
    s3:
      endpoint: ${TRELLIS_S3_ENDPOINT:http://localhost:19000}
      region: ${TRELLIS_S3_REGION:us-east-1}
      bucket: ${TRELLIS_S3_BUCKET:trellis}
      access-key: ${TRELLIS_S3_ACCESS_KEY:trellis}
      secret-key: ${TRELLIS_S3_SECRET_KEY:trellis-dev-secret}
