# Test overrides. Testcontainers supplies database connections; mail worker stays disabled.
spring:
  liquibase:
    change-log: classpath:db/changelog/db.changelog-test.yaml
  mail:
    host: ${TRELLIS_SMTP_HOST:localhost}
    port: ${TRELLIS_SMTP_PORT:1025}
  graphql:
    schema:
      introspection:
        enabled: false
    graphiql:
      enabled: false
springdoc:
  api-docs:
    enabled: true
management:
  tracing:
    sampling:
      probability: ${TRELLIS_TRACE_SAMPLING:0.1}
trellis:
  security:
    cors:
      allowed-origins: ${TRELLIS_CORS_ORIGINS:}
    public-paths: /error,/v3/api-docs,/v3/api-docs/**
  identity:
    verify-email-uri: ${TRELLIS_IDENTITY_VERIFY_EMAIL_URI:https://example.test/verify-email}
    mail-from: ${TRELLIS_IDENTITY_MAIL_FROM:no-reply@example.test}
    mail:
      encryption-key: ${TRELLIS_IDENTITY_MAIL_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      worker-enabled: false
  pagination:
    cursor-secret: ${TRELLIS_CURSOR_SECRET:}
  rate-limit:
    key-secret: local-rate-limit-secret
    namespace: trellis-local
    store: ${TRELLIS_RATE_LIMIT_STORE:memory}
  events:
    transport: inmemory
    relay:
      enabled: false
  setup:
    s3:
      connect-timeout: ${TRELLIS_S3_CONNECT_TIMEOUT:1s}
      request-timeout: ${TRELLIS_S3_REQUEST_TIMEOUT:3s}
