# Schema and the data every environment needs, in the order it must run. Included by each environment's
# master; environments differ only by what they add on top, never by what is here (decision T10, ADR 0004).
#
# Order matters and never changes: append new includes at the end of their section.
databaseChangeLog:
  # Platform tables
  - include:
      file: db/changelog/platform/persistence/001-migration-step-checkpoint.sql
  - include:
      file: db/changelog/platform/aop/001-audit-event.sql
  - include:
      file: db/changelog/platform/events/001-outbox-and-inbox.sql
  - include:
      file: db/changelog/platform/security/001-access-grant.sql
  - include:
      file: db/changelog/platform/security/002-platform-roles.sql
  # Business modules: add `- include: { file: db/changelog/<module>/NNN-<change>.sql }` below.
  - include:
      file: db/changelog/notice/001-notice.sql
  - include:
      file: db/changelog/notice/002-notice-roles.sql
  - include:
      file: db/changelog/learning-content/001-course.sql
  - include:
      file: db/changelog/learning-content/002-course-roles.sql
  - include:
      file: db/changelog/identity/001-native-identity.sql
  - include:
      file: db/changelog/identity/003-action-token-serialization.sql
  - include:
      file: db/changelog/identity/004-identity-mail-job.sql
  - include:
      file: db/changelog/platform/security/003-security-event.sql
