# Smoke: the developer compose file, profile `full`, with the backend image this pipeline built. No
# second description of the infrastructure in GitLab `services:` (plan 10 B2.7, DataHub
# run-quickstart.sh). When the path rules skipped the image build, the floating `main` tag is used.

smoke:compose:
  extends: [.docker, .rules:smoke]
  stage: smoke
  needs:
    - job: ci:vars
    - job: docker:build:backend
      optional: true
  variables:
    COMPOSE_FILE: build-logic/docker/compose.yml
    COMPOSE_PROFILES: full
    COMPOSE_PROJECT_NAME: trellis-smoke
    TRELLIS_REGISTRY: $CI_REGISTRY_IMAGE
    TRELLIS_EVENTS_TRANSPORT: kafka
    TRELLIS_SETUP_KAFKA_TOPICS: "true"
    TRELLIS_SETUP_S3_BUCKET: "true"
    TRELLIS_OTEL_ENABLED: "true"
    # Published ports live on the DinD host, reachable from this job as `docker`.
    TRELLIS_BIND: 0.0.0.0
    TRELLIS_SMOKE_HOST: docker
  script:
    - apk add --no-cache curl >/dev/null
    - build-logic/scripts/ci/resolve-images.sh > images.env
    - cat images.env
    - set -a; . ./images.env; set +a
    # Print what will actually run: a green smoke against a stale image looks identical to a real one.
    - docker compose config --images
    - docker compose pull --quiet
    - docker compose up --detach --no-build --wait --wait-timeout 420
    - build-logic/scripts/ci/smoke.sh
  after_script:
    - mkdir -p docker-logs
    - docker compose ps --all > docker-logs/ps.txt 2>&1 || true
    - docker compose logs --no-color --timestamps > docker-logs/compose.log 2>&1 || true
    - docker compose down --volumes --remove-orphans || true
  artifacts:
    when: always
    expire_in: 7 days
    paths: [docker-logs/, images.env]
    reports:
      junit: smoke-junit.xml
