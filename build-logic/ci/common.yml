# Shared building blocks: path rules, caches, tool images, pipeline variables.
#
# Rule shape (plan 10 B2.3, DataHub's ci-optimization):
#   - MR pipeline: run only when the area's paths changed against the target branch.
#   - Branch pipeline (main, branches without an MR, schedules, manual runs): always run.
#   - Tag pipeline: never, except the jobs that exist for releases (build-logic/ci/release.yml, build-logic/ci/contracts.yml).
#
# This repo holds the Java backend and the contracts it publishes (decisions T21, T22), so there are
# two areas: `java` (the Gradle build and its image) and `contracts` (the npm + PyPI packages).

# ------------------------------------------------------------------------------------------- rules
# One flat directory per Gradle module at the repo root (decision T25), listed in the three rules
# below. YAML anchors do not cross `include:` boundaries, so the list is spelled out each time: when
# a module is added, add its directory to .rules:java, .rules:image:backend and .rules:smoke.
.rules:java:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - trellis-common/**/*
          - trellis-platform/**/*
          - trellis-platform-events/**/*
          - trellis-platform-web/**/*
          - trellis-notice/**/*
          - trellis-app/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - gradle.properties
          - gradlew
          - build-logic/ci/java.yml
          - build-logic/ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

# The published client packages depend only on the committed contracts and on the generators.
.rules:contracts:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - contracts/**/*
          - build-logic/scripts/contracts/**/*
          - build-logic/ci/contracts.yml
          - build-logic/ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

# Image rules = the area's paths + its Dockerfile + anything that changes how the image is built.
.rules:image:backend:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - trellis-common/**/*
          - trellis-platform/**/*
          - trellis-platform-events/**/*
          - trellis-platform-web/**/*
          - trellis-notice/**/*
          - trellis-app/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - gradle.properties
          - build-logic/docker/backend.Dockerfile*
          - build-logic/ci/docker.yml
          - build-logic/ci/common.yml
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

# Smoke runs when anything that ends up in a running container changed.
.rules:smoke:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - trellis-common/**/*
          - trellis-platform/**/*
          - trellis-platform-events/**/*
          - trellis-platform-web/**/*
          - trellis-notice/**/*
          - trellis-app/**/*
          - contracts/**/*
          - build-logic/**/*
          - gradle/**/*
          - "*.gradle.kts"
          - build-logic/docker/**/*
          - build-logic/scripts/ci/**/*
          - build-logic/ci/**/*
          - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH

.rules:main:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rules:release-tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-rc\.\d+)?$/

# ------------------------------------------------------------------------------------------- images
.image:jdk:
  image: $JDK_IMAGE

.image:uv:
  image: $UV_IMAGE

.image:node:
  image: $NODE_IMAGE
  before_script:
    # pnpm comes from the `packageManager` field of the package.json each job installs from.
    - export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
    - corepack enable

# ------------------------------------------------------------------------------------------- caches
# Every job reads; only the cache:warm:* job on main writes (plan 10 B2.3, DataHub ci-cache-warmup).
# GitLab keeps separate caches for protected branches by default, so MR pipelines cannot read what
# main wrote until "Use separate caches for protected branches" is cleared (Settings > CI/CD >
# General pipelines). See docs/architecture/delivery.md "Cache policy" before changing that.
.cache:gradle:
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  cache:
    key:
      prefix: gradle
      files: [gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml]
    paths:
      - .gradle-home/caches/modules-2/
      - .gradle-home/caches/build-cache-1/
      - .gradle-home/wrapper/
    policy: pull

# The contract generators run in a throwaway venv built by build-logic/scripts/contracts/generate.sh; only uv's
# download cache is worth keeping between jobs.
.cache:uv:
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.cache/uv
    UV_LINK_MODE: copy
  cache:
    key:
      prefix: uv
      files: [build-logic/scripts/contracts/generate.sh]
    paths: [.cache/uv/]
    policy: pull

.cache:pnpm:
  cache:
    key:
      prefix: pnpm
      files: [contracts/codegen/typescript/pnpm-lock.yaml, contracts/packages/npm/pnpm-lock.yaml]
    paths: [.pnpm-store/]
    policy: pull

# ------------------------------------------------------------------------------------------- jobs
# Computes the image tag once and hands it to later jobs as a dotenv artifact (DataHub's `setup` job).
ci:vars:
  stage: .pre
  needs: []
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        IMAGE_TAG="mr${CI_MERGE_REQUEST_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        IMAGE_TAG="sha-${CI_COMMIT_SHORT_SHA}"
      fi
      echo "IMAGE_TAG=$IMAGE_TAG" | tee build.env
  artifacts:
    reports:
      dotenv: build.env

cache:warm:gradle:
  extends: [.rules:main, .image:jdk, .cache:gradle]
  stage: build
  needs: []
  cache:
    policy: pull-push
  script:
    - ./gradlew --build-cache assemble testClasses
  # Not a gate: a warm-up failure must not hide a real failure elsewhere or block main.
  allow_failure: true
