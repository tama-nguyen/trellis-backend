# Security gates. Trivy is the blocking gate on every GitLab tier; the GitLab templates add reports
# (their MR widget and Vulnerability Report need Ultimate; the scan and JSON artifact work on Free).

include:
  # Pipeline secret detection: Free/Premium/Ultimate. Needs a `test` stage in the pipeline.
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # Stable security templates run in branch pipelines only unless this is set (GitLab 18.0+).
  AST_ENABLE_MR_PIPELINES: "true"
  TRIVY_NO_PROGRESS: "true"
  TRIVY_CACHE_DIR: .trivycache/

.trivy:
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  stage: scan
  cache:
    # The vulnerability DB is ~70 MB; refresh at most daily per key.
    key: trivy-db
    paths: [.trivycache/]
    policy: pull-push

# Filesystem scan: dependency lockfiles, secrets, IaC misconfig (Dockerfiles, compose).
trivy:fs:
  extends: .trivy
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  script:
    - trivy fs --config build-logic/ci/trivy.yaml --format json --output trivy-fs.json .
    - trivy fs --config build-logic/ci/trivy.yaml --exit-code 1 .
  artifacts:
    when: always
    expire_in: 7 days
    paths: [trivy-fs.json]

.trivy:image:
  extends: .trivy
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - IMG="$CI_REGISTRY_IMAGE/$IMAGE_NAME:$IMAGE_TAG"
    - trivy image --config build-logic/ci/trivy.yaml --format cyclonedx --output "sbom-$IMAGE_NAME.cdx.json" "$IMG"
    - trivy image --config build-logic/ci/trivy.yaml --exit-code 1 "$IMG"
  artifacts:
    when: always
    expire_in: 30 days
    paths: ["sbom-*.cdx.json"]
    reports:
      # Shown in the UI on Ultimate; on other tiers it is still kept as an artifact.
      cyclonedx: "sbom-*.cdx.json"

trivy:image:backend:
  extends: [.trivy:image, .rules:image:backend]
  needs: [ci:vars, docker:build:backend]
  variables:
    IMAGE_NAME: backend

